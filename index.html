<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!--
      Title and description are kept in step with the PWA manifest in
      vite.config.ts and with store/listings/en.md: the description is that
      file's Play short description verbatim, so the web page, the install
      prompt and the store listing say the same thing.
    -->
    <title>Etto — Daily Macro Tracker</title>

    <!-- PWA / installability -->
    <meta
      name="description"
      content="Track carbs, protein and fats against goals you set for each day of the week."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Etto" />

    <!-- Canonical + social preview. og:title/og:description reuse the title
         and description above verbatim (see the comment on them) so the page,
         its link previews and the install prompt keep saying the same thing.
         og-image.png is rendered by scripts/generate-og-image.mjs. -->
    <link rel="canonical" href="https://etto.fitness/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://etto.fitness/" />
    <meta property="og:title" content="Etto — Daily Macro Tracker" />
    <meta
      property="og:description"
      content="Track carbs, protein and fats against goals you set for each day of the week."
    />
    <meta property="og:image" content="https://etto.fitness/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Fonts: Figtree (UI text) + Instrument Serif (headline-lg) + Material
         Symbols Outlined, self-hosted from /public/fonts. They must not come
         from a CDN: Icon.tsx renders Material Symbols as a *ligature*, so if
         that font fails to load every icon in the app renders as the literal
         word "dashboard", "close", "barcode_scanner". In a Capacitor WebView
         the service worker that used to cache it never registers, which makes
         an offline first launch exactly that failure. Manrope is kept as the
         first fallback face (see --font-sans) but is not preloaded. See
         src/index.css for the @font-face rules. -->
    <link
      rel="preload"
      href="/fonts/material-symbols-outlined.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="/fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="/fonts/instrument-serif-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!--
      Live browser-chrome color, rewritten by src/lib/theme.ts whenever the
      scheme changes.

      It carries an id because vite-plugin-pwa appends a second theme-color meta
      at the end of <head>, built from the manifest's `theme_color` (the brand
      sage, which is the *install* color: the PWA title bar and task switcher).
      A user agent uses the first matching tag, so this one governs the running
      document — but everything that writes it must target the id, or it would
      be a coin flip which of the two it found.
    -->
    <meta id="app-theme-color" name="theme-color" content="#f4f6ee" />
    <!--
      Theme, before the first paint.

      This has to run inline and synchronously: the bundle is a module, so it
      only executes after the document has been parsed and painted, and the app
      would flash white before React could add the `dark` class. Kept
      deliberately tiny and duplicated rather than imported — it mirrors
      getStoredTheme/detectDeviceTheme/applyTheme in src/lib/theme.ts, including
      the storage key, and those are the source of truth for everything after
      this moment. The legacy `macrotrack.theme` fallback matches the one-time
      migration in theme.ts; theme.ts rewrites it to `etto.theme` on boot.
    -->
    <script>
      ;(function () {
        try {
          var stored =
            localStorage.getItem('etto.theme') || localStorage.getItem('macrotrack.theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
          document
            .getElementById('app-theme-color')
            .setAttribute('content', dark ? '#14180f' : '#f4f6ee')
        } catch (e) {
          /* No storage or no matchMedia: light, which is the markup default. */
        }
      })()
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
