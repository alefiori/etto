<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>MacroTrack — Daily Macros Tracker</title>

    <!-- PWA / installability -->
    <meta name="description" content="Track your daily calories and macronutrients." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MacroTrack" />
    <!-- Fonts: Manrope + Material Symbols Outlined (as in the Stitch export),
         self-hosted from /public/fonts. They must not come from a CDN: Icon.tsx
         renders Material Symbols as a *ligature*, so if that font fails to load
         every icon in the app renders as the literal word "dashboard", "close",
         "barcode_scanner". In a Capacitor WebView the service worker that used
         to cache it never registers, which makes an offline first launch
         exactly that failure. See src/index.css for the @font-face rules. -->
    <link
      rel="preload"
      href="/fonts/material-symbols-outlined.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
