<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Android adaptive-icon foreground layer: the rings only (the gradient and
       its sheen come from icon-background.svg). Full-bleed like icon-only.svg —
       capacitor-assets adds the 16.7% adaptive safe-zone inset itself, so the
       launcher's shape mask and parallax never clip the outer ring. -->
  <!-- "Meridian" rings — geometry in step with public/icon.svg. -->
  <g transform="scale(2)">
    <g fill="none" stroke-linecap="round" stroke-width="30">
      <g transform="rotate(-95 256 256)">
        <circle cx="256" cy="256" r="176" stroke="#ffffff" stroke-opacity=".16"></circle>
        <circle cx="256" cy="256" r="176" stroke="#CF9B6C" stroke-dasharray="730 376"></circle>
      </g>
      <g transform="rotate(-20 256 256)">
        <circle cx="256" cy="256" r="120" stroke="#ffffff" stroke-opacity=".16"></circle>
        <circle cx="256" cy="256" r="120" stroke="#7BA7C4" stroke-dasharray="407 347"></circle>
      </g>
      <g transform="rotate(60 256 256)">
        <circle cx="256" cy="256" r="72" stroke="#ffffff" stroke-opacity=".16"></circle>
        <circle cx="256" cy="256" r="72" stroke="#C98A97" stroke-dasharray="344 109"></circle>
      </g>
    </g>
  </g>
</svg>
