<svg width="2732" height="2732" viewBox="0 0 2732 2732" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Launch screen, light.

       Composition is centred, per the design's launch-splash frame, and that is
       not just taste here. One 2732 square is cover-cropped to every device and
       orientation, so the only region guaranteed to survive is the middle: the
       tallest phone (9:19.5 portrait) keeps a 1261px-wide band, and landscape
       keeps a 1261px-tall one. Everything below sits inside that centred
       1261 box. The previous layout put the block at x=830 with the wordmark
       left-aligned, which a portrait crop stranded in the upper-left corner
       with the right half of the screen empty.

       The design pins a progress bar 52px off the bottom of its phone frame.
       That cannot survive a crop to arbitrary aspect — the bottom edge is the
       first thing to go — so it sits under the tagline instead.

       Ground and tile are the app's own: the aurora from src/index.css and
       public/icon.svg. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="2732" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7F7FB"></stop>
      <stop offset="1" stop-color="#EDEDF4"></stop>
    </linearGradient>
    <radialGradient id="auroraBlue">
      <stop offset="0" stop-color="#CFE0FF" stop-opacity="1"></stop>
      <stop offset="1" stop-color="#CFE0FF" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="auroraPink">
      <stop offset="0" stop-color="#FFD9E8" stop-opacity="1"></stop>
      <stop offset="1" stop-color="#FFD9E8" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="auroraGreen">
      <stop offset="0" stop-color="#DDF3E4" stop-opacity="1"></stop>
      <stop offset="1" stop-color="#DDF3E4" stop-opacity="0"></stop>
    </radialGradient>
    <linearGradient id="tile" x1="96" y1="0" x2="416" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B72FF"></stop>
      <stop offset="1" stop-color="#5B3FE0"></stop>
    </linearGradient>
    <linearGradient id="specular" x1="256" y1="16" x2="256" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".42"></stop>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"></stop>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B72FF"></stop>
      <stop offset="1" stop-color="#5B3FE0"></stop>
    </linearGradient>
    <clipPath id="tileClip">
      <rect width="512" height="512" rx="120"></rect>
    </clipPath>
  </defs>

  <rect width="2732" height="2732" fill="url(#ground)"></rect>
  <ellipse cx="490" cy="110" rx="1530" ry="1310" fill="url(#auroraBlue)"></ellipse>
  <ellipse cx="2350" cy="270" rx="1200" ry="1090" fill="url(#auroraPink)"></ellipse>
  <ellipse cx="2510" cy="2240" rx="1420" ry="1260" fill="url(#auroraGreen)"></ellipse>

  <!-- The app icon at 360px, 512-space artwork scaled 0.703 and centred. -->
  <g transform="translate(1186 1006) scale(0.703)">
    <rect width="512" height="512" rx="120" fill="url(#tile)"></rect>
    <g clip-path="url(#tileClip)" transform="rotate(-90 256 256)">
      <g fill="none" stroke-linecap="round">
        <circle cx="256" cy="256" r="150" stroke="#ffffff" stroke-opacity=".22" stroke-width="34"></circle>
        <circle cx="256" cy="256" r="150" stroke="#FF9F0A" stroke-width="34" stroke-dasharray="942" stroke-dashoffset="236"></circle>
        <circle cx="256" cy="256" r="106" stroke="#ffffff" stroke-opacity=".22" stroke-width="34"></circle>
        <circle cx="256" cy="256" r="106" stroke="#0A84FF" stroke-width="34" stroke-dasharray="666" stroke-dashoffset="200"></circle>
        <circle cx="256" cy="256" r="62" stroke="#ffffff" stroke-opacity=".22" stroke-width="34"></circle>
        <circle cx="256" cy="256" r="62" stroke="#FF375F" stroke-width="34" stroke-dasharray="390" stroke-dashoffset="156"></circle>
      </g>
    </g>
    <g clip-path="url(#tileClip)">
      <path d="M0 0h512v150c-90 52-180 78-256 78S90 202 0 150Z" fill="url(#specular)"></path>
      <rect x="1.5" y="1.5" width="509" height="509" rx="118.5" fill="none" stroke="#ffffff" stroke-opacity=".38" stroke-width="3"></rect>
    </g>
  </g>

  <!-- text-anchor rather than the textLength pinning the old layout used:
       centring holds whatever width the rasterizer's fallback font produces,
       so nothing has to be distorted to stay in place. -->
  <text x="1366" y="1560" text-anchor="middle" font-family="Manrope, -apple-system, Roboto, 'Helvetica Neue', sans-serif" font-size="124" font-weight="800" letter-spacing="-4" fill="#14141C">MacroTrack</text>
  <text x="1366" y="1648" text-anchor="middle" font-family="Manrope, -apple-system, Roboto, 'Helvetica Neue', sans-serif" font-size="52" font-weight="400" fill="#5A5A68">Track your macros, reach your goals.</text>

  <rect x="1216" y="1734" width="300" height="10" rx="5" fill="#DCDCE8"></rect>
  <rect x="1216" y="1734" width="128" height="10" rx="5" fill="url(#bar)"></rect>
</svg>
