<svg width="2732" height="2732" viewBox="0 0 2732 2732" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Launch screen, light.

       No design-project counterpart: the icon set is authored there, the splash
       is composed here from it. The brief is only that the launch image and the
       first frame of the app agree, so the ground is the same aurora the app
       paints on the page (the aurora custom property in src/index.css) and the tile is
       public/icon.svg at 240pt.

       2732² because iOS crops one square to every device and orientation; the
       wordmark block sits near the middle so no crop loses it. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="2732" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7F7FB"></stop>
      <stop offset="1" stop-color="#EDEDF4"></stop>
    </linearGradient>
    <radialGradient id="auroraBlue">
      <stop offset="0" stop-color="#CFE0FF" stop-opacity="1"></stop>
      <stop offset="1" stop-color="#CFE0FF" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="auroraPink">
      <stop offset="0" stop-color="#FFD9E8" stop-opacity="1"></stop>
      <stop offset="1" stop-color="#FFD9E8" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="auroraGreen">
      <stop offset="0" stop-color="#DDF3E4" stop-opacity="1"></stop>
      <stop offset="1" stop-color="#DDF3E4" stop-opacity="0"></stop>
    </radialGradient>
    <linearGradient id="tile" x1="96" y1="0" x2="416" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B72FF"></stop>
      <stop offset="1" stop-color="#5B3FE0"></stop>
    </linearGradient>
    <linearGradient id="specular" x1="256" y1="16" x2="256" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".42"></stop>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"></stop>
    </linearGradient>
    <clipPath id="tileClip">
      <rect width="512" height="512" rx="120"></rect>
    </clipPath>
  </defs>

  <rect width="2732" height="2732" fill="url(#ground)"></rect>
  <ellipse cx="330" cy="190" rx="1440" ry="1060" fill="url(#auroraBlue)"></ellipse>
  <ellipse cx="2400" cy="380" rx="1290" ry="990" fill="url(#auroraPink)"></ellipse>
  <ellipse cx="1690" cy="2732" rx="1710" ry="1330" fill="url(#auroraGreen)"></ellipse>

  <!-- Oversized rings, bled off the top-right corner: the same object as the
       tile below, read as texture rather than as a second logo. -->
  <g transform="translate(1980 640) scale(2.6) translate(-256 -256)" opacity="0.42">
    <g fill="none" stroke-linecap="round" transform="rotate(-90 256 256)">
      <circle cx="256" cy="256" r="150" stroke="#DAD9EA" stroke-width="34"></circle>
      <circle cx="256" cy="256" r="150" stroke="#FF9F0A" stroke-width="34" stroke-dasharray="942" stroke-dashoffset="236"></circle>
      <circle cx="256" cy="256" r="106" stroke="#DAD9EA" stroke-width="34"></circle>
      <circle cx="256" cy="256" r="106" stroke="#0A84FF" stroke-width="34" stroke-dasharray="666" stroke-dashoffset="200"></circle>
      <circle cx="256" cy="256" r="62" stroke="#DAD9EA" stroke-width="34"></circle>
      <circle cx="256" cy="256" r="62" stroke="#FF375F" stroke-width="34" stroke-dasharray="390" stroke-dashoffset="156"></circle>
    </g>
  </g>

  <!-- The app icon, 512-space artwork at 0.469 -> 240pt. -->
  <g transform="translate(830 1120) scale(0.469)">
    <rect width="512" height="512" rx="120" fill="url(#tile)"></rect>
    <g clip-path="url(#tileClip)" transform="rotate(-90 256 256)">
      <g fill="none" stroke-linecap="round">
        <circle cx="256" cy="256" r="150" stroke="#ffffff" stroke-opacity=".22" stroke-width="34"></circle>
        <circle cx="256" cy="256" r="150" stroke="#FF9F0A" stroke-width="34" stroke-dasharray="942" stroke-dashoffset="236"></circle>
        <circle cx="256" cy="256" r="106" stroke="#ffffff" stroke-opacity=".22" stroke-width="34"></circle>
        <circle cx="256" cy="256" r="106" stroke="#0A84FF" stroke-width="34" stroke-dasharray="666" stroke-dashoffset="200"></circle>
        <circle cx="256" cy="256" r="62" stroke="#ffffff" stroke-opacity=".22" stroke-width="34"></circle>
        <circle cx="256" cy="256" r="62" stroke="#FF375F" stroke-width="34" stroke-dasharray="390" stroke-dashoffset="156"></circle>
      </g>
    </g>
    <g clip-path="url(#tileClip)">
      <path d="M0 0h512v150c-90 52-180 78-256 78S90 202 0 150Z" fill="url(#specular)"></path>
      <rect x="1.5" y="1.5" width="509" height="509" rx="118.5" fill="none" stroke="#ffffff" stroke-opacity=".38" stroke-width="3"></rect>
    </g>
  </g>

  <text x="830" y="1560" font-family="Manrope, -apple-system, Roboto, &#39;Helvetica Neue&#39;, sans-serif" font-size="140" font-weight="800" letter-spacing="-4" fill="#14141C">MacroTrack</text>
  <text x="830" y="1650" font-family="Manrope, -apple-system, Roboto, &#39;Helvetica Neue&#39;, sans-serif" font-size="56" font-weight="400" fill="#5A5A68">Track your macros, every day.</text>

  <rect x="830" y="1730" width="330" height="10" rx="5" fill="#DCDCE8"></rect>
  <rect x="830" y="1730" width="140" height="10" rx="5" fill="#6E56F8"></rect>
</svg>
