<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef1e6; }
    a { color: #5c8466; } a:hover { color: #48694f; }

    .scr { width: 390px; min-height: 844px; position: relative; background: #eef1e6;
      font-family: "Figtree", system-ui, sans-serif; color: #37423a; -webkit-font-smoothing: antialiased;
      padding: 56px 24px 40px; display: flex; flex-direction: column; }
    .ic { width: 22px; height: 22px; display: block; }
    .card { background: #fbfcf7; border-radius: 26px; padding: 24px; box-shadow: 0 14px 34px rgba(55,66,52,.07); }

    .step { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #9aa79b; }
    .h { font-family: "Instrument Serif", Georgia, serif; font-size: 32px; line-height: 1.12; color: #3f5a46; margin-top: 8px; }
    .sub { margin-top: 10px; font-size: 14px; line-height: 1.5; color: #7b8a7d; }

    .goalchips { display: flex; gap: 8px; margin: 22px 0 18px; }
    .gchip { flex: 1; text-align: center; font-size: 13px; font-weight: 600; color: #7b8a7d;
      background: #fbfcf7; border: 1px solid #e4e8dd; border-radius: 999px; padding: 11px 0; }
    .gchip.on { background: #5c8466; color: #fbfcf7; border-color: #5c8466; }

    .suggest .stitle { font-size: 13px; font-weight: 600; color: #6a7a6d; }
    .krow { display: flex; align-items: baseline; gap: 8px; margin-top: 8px; }
    .knum { font-size: 40px; font-weight: 700; letter-spacing: -.02em; color: #3f5a46; }
    .kunit { font-size: 13px; color: #9aa79b; }
    .msplit { display: flex; gap: 8px; margin-top: 18px; }
    .mcol { flex: 1; text-align: center; background: #f3f5ee; border-radius: 16px; padding: 12px 0; }
    .mdot { width: 8px; height: 8px; border-radius: 999px; margin: 0 auto 6px; }
    .mg { font-size: 16px; font-weight: 700; color: #3f5a46; }
    .mn { font-size: 11px; color: #9aa79b; margin-top: 2px; }

    .primary { margin-top: 24px; width: 100%; text-align: center; font-size: 15px; font-weight: 700;
      color: #fbfcf7; background: #5c8466; border-radius: 999px; padding: 16px; }
    .secondary { margin-top: 12px; width: 100%; text-align: center; font-size: 14px; font-weight: 600; color: #6a7a6d;
      background: #fbfcf7; border: 1px solid #e4e8dd; border-radius: 999px; padding: 14px; }
    .later { margin-top: auto; padding-top: 24px; text-align: center; font-size: 13px; font-weight: 600; color: #9aa79b; }
  </style>
</helmet>

<div class="scr">
  <div class="step">Step 3 of 3</div>
  <div class="h">Here are your starting targets</div>
  <div class="sub">Worked out from your body details and goal. You can fine-tune any day later.</div>

  <div class="goalchips">
    <div class="gchip on">Lose</div>
    <div class="gchip">Maintain</div>
    <div class="gchip">Gain</div>
  </div>

  <div class="card suggest">
    <div class="stitle">Daily energy</div>
    <div class="krow"><span class="knum">2,106</span><span class="kunit">kcal / day</span></div>
    <div class="msplit">
      <div class="mcol"><div class="mdot" style="background:#cf9b6c;"></div><div class="mg">228 g</div><div class="mn">Carbs</div></div>
      <div class="mcol"><div class="mdot" style="background:#7ba7c4;"></div><div class="mg">150 g</div><div class="mn">Protein</div></div>
      <div class="mcol"><div class="mdot" style="background:#c98a97;"></div><div class="mg">66 g</div><div class="mn">Fat</div></div>
    </div>
  </div>

  <div class="primary">Use these targets</div>
  <div class="secondary">Set them manually instead</div>

  <div class="later">Skip for now</div>
</div>
</x-dc>
</body>
</html>
