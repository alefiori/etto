<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #dfe4d6; }
    a { color: #5c8466; } a:hover { color: #48694f; }

    .scr { width: 390px; min-height: 1100px; position: relative; background: #fbfcf7;
      font-family: "Figtree", system-ui, sans-serif; color: #37423a; -webkit-font-smoothing: antialiased;
      padding: 10px 18px 130px; border-radius: 28px 28px 0 0; }
    .ic { width: 22px; height: 22px; display: block; }

    .handle { width: 40px; height: 4px; border-radius: 999px; background: #dfe4d6; margin: 4px auto 16px; }
    .shead { display: flex; align-items: center; justify-content: space-between; }
    .stitle { font-size: 20px; font-weight: 700; color: #3f5a46; }
    .xbtn { width: 34px; height: 34px; border-radius: 999px; background: #eef1e6; color: #7b8a7d;
      display: flex; align-items: center; justify-content: center; }

    .field { margin-top: 18px; }
    .flabel { font-size: 12px; font-weight: 600; color: #6a7a6d; margin-bottom: 7px; display: block; }
    .fbox { width: 100%; height: 46px; border: 1px solid #e4e8dd; background: #f4f6ee; border-radius: 14px;
      display: flex; align-items: center; padding: 0 14px; font-size: 15px; font-weight: 500; color: #37423a; }
    .fbox.ph { color: #9aa79b; font-weight: 400; }

    .two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }

    .macrosplit { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 18px; }
    .ms { }
    .ms .flabel { display: flex; align-items: center; gap: 7px; }
    .ms .d { width: 8px; height: 8px; border-radius: 999px; }
    .ms .fbox { justify-content: flex-end; font-weight: 700; }

    .kcalout { margin-top: 18px; display: flex; align-items: center; justify-content: space-between;
      background: #eef4ea; border-radius: 16px; padding: 14px 18px; }
    .kcalout .k { font-size: 12px; font-weight: 600; color: #5f7a63; }
    .kcalout .v { font-size: 22px; font-weight: 700; color: #3f5a46; }

    .sharerow { margin-top: 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 14px 0; border-top: 1px solid #eef1e6; }
    .sharerow .t { font-size: 14px; font-weight: 600; }
    .sharerow .s { font-size: 12px; color: #9aa79b; margin-top: 2px; }
    .toggle { width: 46px; height: 27px; border-radius: 999px; background: #cfe0d2; position: relative; flex: none; }
    .toggle i { position: absolute; top: 3px; right: 3px; width: 21px; height: 21px; border-radius: 999px; background: #5c8466; box-shadow: 0 1px 3px rgba(0,0,0,.15); }

    .save { margin-top: 24px; width: 100%; text-align: center; font-size: 15px; font-weight: 600;
      color: #fbfcf7; background: #5c8466; border-radius: 999px; padding: 15px; }
  </style>
</helmet>

<div class="scr">
  <div class="handle"></div>

  <div class="shead">
    <div class="stitle">New custom food</div>
    <div class="xbtn"><svg class="ic" style="width:18px;height:18px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></div>
  </div>

  <div class="field">
    <label class="flabel">Name</label>
    <div class="fbox">Overnight oats</div>
  </div>

  <div class="field">
    <label class="flabel">Brand <span style="color:#9aa79b;font-weight:400;">(optional)</span></label>
    <div class="fbox ph">e.g. homemade</div>
  </div>

  <div class="field">
    <label class="flabel">Serving</label>
    <div class="two">
      <div class="fbox" style="justify-content:flex-end;font-weight:700;">250</div>
      <div class="fbox">grams</div>
    </div>
  </div>

  <div class="macrosplit">
    <div class="ms">
      <label class="flabel"><span class="d" style="background:#cf9b6c;"></span>Carbs</label>
      <div class="fbox">44</div>
    </div>
    <div class="ms">
      <label class="flabel"><span class="d" style="background:#7ba7c4;"></span>Protein</label>
      <div class="fbox">12</div>
    </div>
    <div class="ms">
      <label class="flabel"><span class="d" style="background:#c98a97;"></span>Fat</label>
      <div class="fbox">9</div>
    </div>
  </div>

  <div class="kcalout">
    <div class="k">Calories per serving</div>
    <div class="v">≈ 305</div>
  </div>

  <div class="sharerow">
    <div>
      <div class="t">Share to the community</div>
      <div class="s">Others can find it in search</div>
    </div>
    <div class="toggle"><i></i></div>
  </div>

  <div class="save">Save food</div>
</div>
</x-dc>
</body>
</html>
