<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- The app icon, light. Source of truth for the PWA + native icon sets:
       public/ is the @vite-pwa/assets-generator input (pwa-assets.config.ts)
       and assets/ derives the full-bleed native variants from this artwork.
       Regenerate the web PNGs with `pnpm exec pwa-assets-generator` after editing. -->
  <defs>
    <linearGradient id="tile" x1="96" y1="0" x2="416" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5C8466"></stop>
      <stop offset="1" stop-color="#47694F"></stop>
    </linearGradient>
    <linearGradient id="specular" x1="256" y1="16" x2="256" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".42"></stop>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"></stop>
    </linearGradient>
    <clipPath id="clip">
      <rect width="512" height="512" rx="120"></rect>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="120" fill="url(#tile)"></rect>

  <!-- "Meridian": three macro arcs (carbs / protein / fat) on a wide radius
       spread, each ring's gap rotated to its own angle so the openings spiral
       rather than stack into a bullseye. Geometry is shared verbatim with
       design/logo-concepts/01-meridian.svg, assets/icon-only.svg,
       assets/icon-foreground.svg and scripts/build-splash.py. -->
  <g clip-path="url(#clip)" fill="none" stroke-linecap="round" stroke-width="30">
    <g transform="rotate(-95 256 256)">
      <circle cx="256" cy="256" r="176" stroke="#ffffff" stroke-opacity=".16"></circle>
      <circle cx="256" cy="256" r="176" stroke="#CF9B6C" stroke-dasharray="730 376"></circle>
    </g>
    <g transform="rotate(-20 256 256)">
      <circle cx="256" cy="256" r="120" stroke="#ffffff" stroke-opacity=".16"></circle>
      <circle cx="256" cy="256" r="120" stroke="#7BA7C4" stroke-dasharray="407 347"></circle>
    </g>
    <g transform="rotate(60 256 256)">
      <circle cx="256" cy="256" r="72" stroke="#ffffff" stroke-opacity=".16"></circle>
      <circle cx="256" cy="256" r="72" stroke="#C98A97" stroke-dasharray="344 109"></circle>
    </g>
  </g>

  <g clip-path="url(#clip)">
    <path d="M0 0h512v150c-90 52-180 78-256 78S90 202 0 150Z" fill="url(#specular)"></path>
    <rect x="1.5" y="1.5" width="509" height="509" rx="118.5" fill="none" stroke="#ffffff" stroke-opacity=".38" stroke-width="3"></rect>
  </g>
</svg>
