name: Release mobile

# Signed, distributable builds. Separate from CI because these need signing
# material and produce store uploads, whereas the `android` / `ios` jobs in
# ci.yml only prove the projects compile.
#
# Every job skips with a warning when its secrets are absent, the same way
# supabase-deploy does — so this workflow is safe to merge before any developer
# account exists.
on:
  workflow_dispatch:
    inputs:
      track:
        description: What the artifacts are for (informational; recorded in the summary)
        type: choice
        default: internal
        options: [internal, beta, production]
  push:
    tags: ['v*']

jobs:
  android:
    name: Android release bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      # Capacitor 8 ships AGP 8.13 on Gradle 8.14, which wants JDK 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Cached separately rather than via setup-java's `cache: gradle`, which
      # builds its key by hashing **/*.gradle* — files that do not exist yet at
      # that point, because android/ is generated further down. It fails the job
      # outright rather than just missing the cache. Keyed on pnpm-lock.yaml
      # instead: the Capacitor version pins the AGP, Gradle and plugin versions
      # that decide what gets downloaded.
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Check for signing material
        id: gate
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$SUPABASE_URL" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 / VITE_SUPABASE_URL not set; skipping the Android release build."
            echo "### Android release: :grey_question: skipped (missing secrets)" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.gate.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      # Both stores refuse a second upload that reuses a version, and android/
      # is regenerated below carrying Capacitor's default versionCode 1 — so
      # without this every release after the first is rejected. The tag is the
      # source of truth; --write-package also keeps the version shown on the
      # Profile page in step with what the store shows.
      - name: Resolve the version
        id: version
        if: steps.gate.outputs.ready == 'true'
        run: node scripts/native-version.mjs --write-package >> "$GITHUB_OUTPUT"

      # These are inlined into the bundle at build time, so a release build must
      # carry the real project's values — unlike the CI verification build.
      - name: Build the native web bundle
        if: steps.gate.outputs.ready == 'true'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
          VITE_SUPPORT_EMAIL: ${{ secrets.VITE_SUPPORT_EMAIL }}
        # --strict: a release must not publish legal documents that name a
        # placeholder contact. See scripts/build-legal.mjs.
        run: |
          node scripts/build-legal.mjs --strict
          pnpm run build:native

      - name: Generate the Android project
        if: steps.gate.outputs.ready == 'true'
        run: |
          pnpm exec cap add android
          pnpm exec cap sync android
          node scripts/patch-android-webview.mjs
          node scripts/generate-native-icons.mjs

      - name: Decode the keystore
        if: steps.gate.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      # The Android project is generated fresh each run and gitignored, so there
      # is no checked-in build.gradle to hold a signingConfig. AGP's injected
      # signing properties do the same job from the command line. Both outputs
      # are produced: the AAB for the Play Store, the APK for the GitHub Release
      # (directly installable / sideloadable).
      - name: Assemble signed AAB and APK
        if: steps.gate.outputs.ready == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          android/gradlew -p android bundleRelease assembleRelease --no-daemon \
            -Pandroid.injected.version.name="${{ steps.version.outputs.VERSION_NAME }}" \
            -Pandroid.injected.version.code="${{ steps.version.outputs.VERSION_CODE }}" \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload AAB
        if: steps.gate.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload APK
        if: steps.gate.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Summarize
        if: steps.gate.outputs.ready == 'true'
        run: |
          echo "### Android release: :white_check_mark: signed AAB + APK built (${{ inputs.track || 'tag' }})" >> "$GITHUB_STEP_SUMMARY"
          echo "The APK is attached to the GitHub Release; upload the AAB to the Play Console." >> "$GITHUB_STEP_SUMMARY"

  ios:
    name: iOS release archive
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Check for signing material
        id: gate
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          if [ -z "$CERT" ] || [ -z "$PROFILE" ] || [ -z "$SUPABASE_URL" ]; then
            echo "::warning::Apple signing secrets / VITE_SUPABASE_URL not set; skipping the iOS release build."
            echo "### iOS release: :grey_question: skipped (missing secrets)" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.gate.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      # Same reasoning as the Android job: ios/ is regenerated below with
      # Capacitor's MARKETING_VERSION 1.0 / CURRENT_PROJECT_VERSION 1, and App
      # Store Connect refuses a build number it has already seen.
      - name: Resolve the version
        id: version
        if: steps.gate.outputs.ready == 'true'
        run: node scripts/native-version.mjs --write-package >> "$GITHUB_OUTPUT"

      - name: Build the native web bundle
        if: steps.gate.outputs.ready == 'true'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
          VITE_SUPPORT_EMAIL: ${{ secrets.VITE_SUPPORT_EMAIL }}
        run: |
          node scripts/build-legal.mjs --strict
          pnpm run build:native

      - name: Generate the iOS project
        if: steps.gate.outputs.ready == 'true'
        run: |
          pnpm exec cap add ios
          pnpm exec cap sync ios
          node scripts/generate-native-icons.mjs
          # Camera usage string, CFBundleLocalizations and the privacy manifest.
          node scripts/patch-ios-project.mjs
          pnpm run verify:ipad

      # Done with the `security` CLI rather than a third-party action, to keep
      # this workflow's dependencies to actions/* only. The keychain is
      # ephemeral and deleted below whatever happens.
      - name: Install the signing certificate and profile
        if: steps.gate.outputs.ready == 'true'
        env:
          CERT_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)

          echo "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/"

          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Archive and export IPA
        if: steps.gate.outputs.ready == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.APPLE_PROVISIONING_PROFILE_NAME }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>fitness.etto</key><string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          PLIST

          # Info.plist reads both of these through $(...), so overriding the
          # build settings here is what actually versions the archive.
          xcodebuild \
            $(./scripts/xcode-target.sh) \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            MARKETING_VERSION="${{ steps.version.outputs.VERSION_NAME }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.VERSION_CODE }}" \
            archive

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Remove the signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision" || true

      - name: Upload IPA
        if: steps.gate.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      - name: Summarize
        if: steps.gate.outputs.ready == 'true'
        run: |
          echo "### iOS release: :white_check_mark: signed IPA exported (${{ inputs.track || 'tag' }})" >> "$GITHUB_STEP_SUMMARY"
          echo "The IPA is attached to the GitHub Release; upload it to App Store Connect with Transporter or \`xcrun altool\`." >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish GitHub Release
    needs: [android, ios]
    # Only a tag push cuts a release. A manual workflow_dispatch run just builds
    # the artifacts for inspection and leaves the Releases page untouched.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the build artifacts
        uses: actions/download-artifact@v4
        # No `name`, so this pulls whatever the android/ios jobs uploaded. Either
        # may have skipped when its signing secrets were absent, and an all-skip
        # run leaves nothing to download — tolerate that and let the next step
        # decide whether there is anything to publish.
        continue-on-error: true
        with:
          path: artifacts

      - name: Attach the APK and IPA to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s globstar nullglob
          files=(artifacts/**/*.apk artifacts/**/*.ipa)

          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::No signed APK/IPA produced (signing secrets likely absent); skipping the GitHub Release."
            echo "### GitHub Release: :grey_question: skipped (no signed artifacts)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          tag="$GITHUB_REF_NAME"
          # Idempotent: re-running the same tag refreshes the existing release's
          # assets (--clobber) rather than failing on "release already exists".
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$tag" \
              --generate-notes
          fi

          echo "### GitHub Release: :white_check_mark: published \`$tag\` with ${#files[@]} asset(s)" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- %s\n' "${files[@]##*/}" >> "$GITHUB_STEP_SUMMARY"
