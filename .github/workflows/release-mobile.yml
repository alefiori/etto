name: Release mobile

# Signed, distributable builds. Separate from CI because these need signing
# material and produce store uploads, whereas the `android` / `ios` jobs in
# ci.yml only prove the projects compile.
#
# Every job skips with a warning when its secrets are absent, the same way
# supabase-deploy does — so this workflow is safe to merge before any developer
# account exists.
on:
  workflow_dispatch:
    inputs:
      track:
        description: What the artifacts are for (informational; recorded in the summary)
        type: choice
        default: internal
        options: [internal, beta, production]
  push:
    tags: ['v*']

jobs:
  android:
    name: Android release bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Capacitor 6 ships AGP 8.2, which requires JDK 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Check for signing material
        id: gate
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$SUPABASE_URL" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 / VITE_SUPABASE_URL not set; skipping the Android release build."
            echo "### Android release: :grey_question: skipped (missing secrets)" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.gate.outputs.ready == 'true'
        run: npm ci

      # These are inlined into the bundle at build time, so a release build must
      # carry the real project's values — unlike the CI verification build.
      - name: Build the native web bundle
        if: steps.gate.outputs.ready == 'true'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build:native

      - name: Generate the Android project
        if: steps.gate.outputs.ready == 'true'
        run: |
          npx cap add android
          npx cap sync android

      - name: Decode the keystore
        if: steps.gate.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      # The Android project is generated fresh each run and gitignored, so there
      # is no checked-in build.gradle to hold a signingConfig. AGP's injected
      # signing properties do the same job from the command line.
      - name: Assemble signed AAB
        if: steps.gate.outputs.ready == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          android/gradlew -p android bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload AAB
        if: steps.gate.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Summarize
        if: steps.gate.outputs.ready == 'true'
        run: |
          echo "### Android release: :white_check_mark: signed AAB built (${{ inputs.track || 'tag' }})" >> "$GITHUB_STEP_SUMMARY"
          echo "Upload it to the Play Console, or add a fastlane/Play publisher step here." >> "$GITHUB_STEP_SUMMARY"

  ios:
    name: iOS release archive
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check for signing material
        id: gate
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          if [ -z "$CERT" ] || [ -z "$PROFILE" ] || [ -z "$SUPABASE_URL" ]; then
            echo "::warning::Apple signing secrets / VITE_SUPABASE_URL not set; skipping the iOS release build."
            echo "### iOS release: :grey_question: skipped (missing secrets)" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.gate.outputs.ready == 'true'
        run: npm ci

      - name: Build the native web bundle
        if: steps.gate.outputs.ready == 'true'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build:native

      - name: Generate the iOS project
        if: steps.gate.outputs.ready == 'true'
        run: |
          npx cap add ios
          npx cap sync ios

      # Done with the `security` CLI rather than a third-party action, to keep
      # this workflow's dependencies to actions/* only. The keychain is
      # ephemeral and deleted below whatever happens.
      - name: Install the signing certificate and profile
        if: steps.gate.outputs.ready == 'true'
        env:
          CERT_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)

          echo "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/"

          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Archive and export IPA
        if: steps.gate.outputs.ready == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.APPLE_PROVISIONING_PROFILE_NAME }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>app.macrotrack</key><string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            archive

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Remove the signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision" || true

      - name: Upload IPA
        if: steps.gate.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      - name: Summarize
        if: steps.gate.outputs.ready == 'true'
        run: |
          echo "### iOS release: :white_check_mark: signed IPA exported (${{ inputs.track || 'tag' }})" >> "$GITHUB_STEP_SUMMARY"
          echo "Upload it with Transporter or \`xcrun altool\`, or add an App Store Connect step here." >> "$GITHUB_STEP_SUMMARY"
