name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a pull request makes the in-flight run obsolete, so cancel it
# rather than paying for both — this matters most for the macOS iOS job, which
# bills at 10x. Pushes to main are never cancelled: those runs deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Errors fail the job; warnings do not. The React Compiler-era hook rules
      # are deliberately warnings — see the reasoning in eslint.config.js.
      - name: Run ESLint
        run: npm run lint

      # The compiler is the other half of the static checks, and the build job
      # below only reaches it after bundling. Running it here fails faster.
      - name: Typecheck
        run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage

      # An <Icon name="..."> whose glyph was never subsetted into
      # public/fonts/material-symbols-outlined.woff2 renders as the literal word
      # to users, and nothing else in the suite would notice. Stdlib-only and
      # offline — it diffs src against scripts/icon-font-manifest.json, so no
      # pip install and no font download.
      - name: Check the icon font covers every icon used
        run: python3 scripts/subset-icon-font.py --check

      # Coverage is reported, not gated — upload it for inspection.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      # GitHub runners have no pre-installed browser, so download the one this
      # @playwright/test version expects (do NOT set PW_EXECUTABLE_PATH here).
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  android:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      # Capacitor 8 ships AGP 8.13 on Gradle 8.14, which wants JDK 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Cached separately rather than via setup-java's `cache: gradle`, which
      # builds its key by hashing **/*.gradle* — files that do not exist yet at
      # that point, because android/ is generated further down. It fails the job
      # outright rather than just missing the cache. Keyed on package-lock
      # instead: the Capacitor version pins the AGP, Gradle and plugin versions
      # that decide what gets downloaded.
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # Placeholders only. The bundle inlines these at build time and the app
      # throws without them, but this job verifies the native project compiles
      # rather than producing a runnable APK — the release workflow passes the
      # real values.
      - name: Build the native web bundle
        env:
          VITE_SUPABASE_URL: https://ci.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-anon-key
        run: npm run build:native

      # ios/ and android/ are gitignored, so the projects are generated fresh
      # each run. That also means this job validates capacitor.config.ts and the
      # installed plugin set, not just the Gradle build.
      - name: Generate the Android project
        run: |
          npx cap add android
          npx cap sync android
          node scripts/patch-android-webview.mjs
          node scripts/generate-native-icons.mjs

      - name: Assemble debug APK
        run: |
          chmod +x android/gradlew
          android/gradlew -p android assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    name: iOS build
    # Runs on pull requests as well as main. macOS runners bill at 10x the
    # minutes of Linux ones, so this is the most expensive job here by a wide
    # margin — the workflow-level `concurrency` above cancels superseded runs to
    # keep that in check. It earns its cost by catching the breakage the Android
    # job cannot see: Swift Package Manager resolution of the Capacitor plugins,
    # Swift compatibility, and the iPad invariants checked below.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the native web bundle
        env:
          VITE_SUPABASE_URL: https://ci.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-anon-key
        run: npm run build:native

      - name: Generate the iOS project
        run: |
          npx cap add ios
          npx cap sync ios
          node scripts/generate-native-icons.mjs
          # Camera usage string, CFBundleLocalizations and the privacy manifest.
          # ios/ is regenerated here, so none of it can be a checked-in edit.
          node scripts/patch-ios-project.mjs

      # ios/ is regenerated every run, so there is no checked-in project file to
      # review. This asserts the iPad invariants Capacitor's template currently
      # gives us for free, so a template change in a future upgrade fails here
      # instead of silently shipping an iPhone-only app.
      - name: Verify the iPad configuration
        run: npm run verify:ipad

      # Compile only. Signing needs an Apple Developer account, so this proves
      # the project builds without needing any secret; the release workflow does
      # the signed archive.
      - name: Build for the simulator (unsigned)
        run: |
          xcodebuild \
            $(./scripts/xcode-target.sh) \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  supabase-deploy:
    name: Supabase deploy (migrations + functions)
    needs: [build, unit, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy database migrations and the food-search Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF / SUPABASE_DB_PASSWORD not set; skipping Supabase deploy."
            echo "### Supabase deploy: :grey_question: skipped (missing secrets)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The CLI is preinstalled on GitHub-hosted runners; fall back to npx.
          SUPABASE="supabase"
          if ! command -v supabase >/dev/null 2>&1; then SUPABASE="npx --yes supabase"; fi

          echo "Linking project $SUPABASE_PROJECT_REF ..."
          $SUPABASE link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

          echo "Applying database migrations ..."
          # Applies any un-applied files in supabase/migrations in order. Safe to
          # re-run; fails only if the remote schema has diverged from history
          # (a one-time `supabase migration repair` may then be needed).
          $SUPABASE db push --password "$SUPABASE_DB_PASSWORD"

          echo "Deploying the food-search Edge Function ..."
          # Code only — existing function secrets (USDA_API_KEY, EDAMAM_*, OFF_*)
          # are managed out-of-band and left untouched.
          $SUPABASE functions deploy food-search --project-ref "$SUPABASE_PROJECT_REF"

          echo "Deploying the revenuecat-webhook Edge Function ..."
          # --no-verify-jwt is required: RevenueCat is not a Supabase client and
          # sends no Supabase JWT. It authenticates with the shared secret in
          # REVENUECAT_WEBHOOK_SECRET, which is a function secret set
          # out-of-band and left untouched here.
          $SUPABASE functions deploy revenuecat-webhook --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

          echo "Deploying the delete-account Edge Function ..."
          # Deliberately NOT --no-verify-jwt: this one deletes the caller's
          # account, and the caller's JWT is what says whose. Deploying it
          # unverified would make account deletion reachable without a session.
          $SUPABASE functions deploy delete-account --project-ref "$SUPABASE_PROJECT_REF"

          echo "### Supabase deploy: :white_check_mark: migrations applied, food-search, revenuecat-webhook and delete-account deployed" >> "$GITHUB_STEP_SUMMARY"

  netlify-deploy-status:
    name: Netlify deploy status
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Netlify deploy of this commit
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::warning::NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID secrets not set; skipping deploy status check."
            echo "### Netlify deploy status: :grey_question: skipped (missing secrets)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Looking for Netlify deploy of commit $GITHUB_SHA ..."

          # Netlify builds are triggered by its own GitHub integration, so the
          # deploy may not exist yet when this job starts. Poll for up to 15 min.
          for i in $(seq 1 90); do
            deploy=$(curl -sf -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
              "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys?per_page=30" \
              | jq --arg sha "$GITHUB_SHA" '[.[] | select(.commit_ref == $sha)] | first')

            state=$(echo "$deploy" | jq -r '.state // empty')
            url=$(echo "$deploy" | jq -r '.deploy_ssl_url // .deploy_url // empty')

            case "$state" in
              ready)
                echo "Deploy succeeded: $url"
                echo "### Netlify deploy status: :white_check_mark: ready" >> "$GITHUB_STEP_SUMMARY"
                echo "$url" >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              error)
                msg=$(echo "$deploy" | jq -r '.error_message // "unknown error"')
                echo "::error::Netlify deploy failed: $msg"
                echo "### Netlify deploy status: :x: error — $msg" >> "$GITHUB_STEP_SUMMARY"
                exit 1
                ;;
              "")
                echo "[$i/90] No deploy for this commit yet, waiting..."
                ;;
              *)
                echo "[$i/90] Deploy state: $state, waiting..."
                ;;
            esac
            sleep 10
          done

          echo "::error::Timed out waiting for the Netlify deploy of $GITHUB_SHA"
          echo "### Netlify deploy status: :hourglass: timed out after 15 min" >> "$GITHUB_STEP_SUMMARY"
          exit 1
