<svg width="620" height="200" viewBox="0 0 620 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
  <title id="t">Etto horizontal lockup</title>
  <!-- Meridian icon + custom wordmark, baseline-weighted. Icon 156, clear space
       to the wordmark ≈ 0.25 × icon. Swap the <g id="icon"> contents for any
       other concept without moving the wordmark. -->
  <defs>
    <linearGradient id="tile" x1="30" y1="0" x2="126" y2="156" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5C8466"></stop>
      <stop offset="1" stop-color="#47694F"></stop>
    </linearGradient>
    <clipPath id="clip"><rect x="16" y="22" width="156" height="156" rx="37"></rect></clipPath>
  </defs>

  <g id="icon">
    <rect x="16" y="22" width="156" height="156" rx="37" fill="url(#tile)"></rect>
    <g clip-path="url(#clip)" transform="translate(16 22) scale(0.3047)" fill="none" stroke-linecap="round" stroke-width="30">
      <g transform="rotate(-95 256 256)">
        <circle cx="256" cy="256" r="176" stroke="#ffffff" stroke-opacity=".16"></circle>
        <circle cx="256" cy="256" r="176" stroke="#CF9B6C" stroke-dasharray="730 376"></circle>
      </g>
      <g transform="rotate(-20 256 256)">
        <circle cx="256" cy="256" r="120" stroke="#ffffff" stroke-opacity=".16"></circle>
        <circle cx="256" cy="256" r="120" stroke="#7BA7C4" stroke-dasharray="407 347"></circle>
      </g>
      <g transform="rotate(60 256 256)">
        <circle cx="256" cy="256" r="72" stroke="#ffffff" stroke-opacity=".16"></circle>
        <circle cx="256" cy="256" r="72" stroke="#C98A97" stroke-dasharray="344 109"></circle>
      </g>
    </g>
    <rect x="17.5" y="23.5" width="153" height="153" rx="35.5" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="3"></rect>
  </g>

  <g id="wordmark" transform="translate(212 23) scale(0.77)" fill="#2F3624">
    <rect x="24" y="35" width="24" height="130" rx="6"></rect>
    <rect x="24" y="35" width="104" height="24" rx="6"></rect>
    <rect x="24" y="88" width="86" height="24" rx="6"></rect>
    <rect x="24" y="141" width="104" height="24" rx="6"></rect>
    <rect x="176" y="18" width="24" height="147" rx="12"></rect>
    <rect x="266" y="18" width="24" height="147" rx="12"></rect>
    <rect x="152" y="70" width="69" height="22" rx="11"></rect>
    <rect x="245" y="70" width="69" height="22" rx="11"></rect>
    <circle cx="408" cy="100" r="63" fill="none" stroke="#2F3624" stroke-width="24"
            stroke-linecap="round" stroke-dasharray="330 66" stroke-dashoffset="-132"></circle>
  </g>
</svg>
