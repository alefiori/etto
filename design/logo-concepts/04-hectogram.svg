<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
  <title id="t">Etto — Hectogram concept</title>
  <!-- Concept 4 "Hectogram": the name made literal. "Un etto" is 100 grams —
       the deli unit for portioning food. One arc sweeps 100 degrees around a
       faint full track, from a centre pivot: a scale, a dial, today's portion
       measured out. The most conceptual mark; needs the wordmark beside it. -->
  <defs>
    <linearGradient id="tile" x1="96" y1="0" x2="416" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5C8466"></stop>
      <stop offset="1" stop-color="#47694F"></stop>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="120" fill="url(#tile)"></rect>

  <g fill="none" transform="rotate(-90 256 256)">
    <circle cx="256" cy="256" r="150" stroke="#ffffff" stroke-opacity=".16" stroke-width="36"></circle>
    <circle cx="256" cy="256" r="150" stroke="#ffffff" stroke-width="36" stroke-linecap="round"
            stroke-dasharray="262 681"></circle>
  </g>
  <circle cx="256" cy="256" r="13" fill="#ffffff"></circle>

  <rect x="1.5" y="1.5" width="509" height="509" rx="118.5" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="3"></rect>
</svg>
