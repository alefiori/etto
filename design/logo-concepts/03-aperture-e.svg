<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
  <title id="t">Etto — Aperture E concept</title>
  <!-- Concept 3 "Aperture E": a lowercase 'e' built from one ring and one bar.
       The ring opens at the lower right like a real 'e' terminal; the crossbar
       runs straight through and pokes a few px past the ring — a measuring
       tick. A monogram that is also a dial. Single colour, holds at 16px. -->
  <defs>
    <linearGradient id="tile" x1="96" y1="0" x2="416" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5C8466"></stop>
      <stop offset="1" stop-color="#47694F"></stop>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="120" fill="url(#tile)"></rect>

  <g transform="rotate(38 256 256)">
    <circle cx="256" cy="256" r="150" fill="none" stroke="#ffffff" stroke-width="40"
            stroke-linecap="round" stroke-dasharray="812 131" stroke-dashoffset="-150"></circle>
  </g>
  <rect x="120" y="239" width="316" height="34" rx="17" fill="#ffffff"></rect>

  <rect x="1.5" y="1.5" width="509" height="509" rx="118.5" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="3"></rect>
</svg>
